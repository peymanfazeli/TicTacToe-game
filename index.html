<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juicy Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero-card" aria-label="Tic Tac Toe game">
      <div class="title-area">
        <p class="eyebrow">Let's Do This</p>
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Tap a tile, claim the glow, and keep the streak alive.</p>
      </div>

      <section class="score-panel" aria-label="Score board">
        <article class="score-card player-x">
          <span class="score-label">Player X</span>
          <strong id="scoreX">0</strong>
        </article>
        <article class="score-card draw-score">
          <span class="score-label">Draws</span>
          <strong id="scoreDraw">0</strong>
        </article>
        <article class="score-card player-o">
          <span class="score-label">Player O</span>
          <strong id="scoreO">0</strong>
        </article>
      </section>

      <div class="status-wrap">
        <p id="statusText" class="status-text">Player X starts</p>
      </div>

      <section id="board" class="board" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </section>

      <div class="actions">
        <button id="nextRoundBtn" class="action-btn primary">Next Round</button>
        <button id="resetBtn" class="action-btn secondary">Reset Scores</button>
      </div>
    </section>
  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
